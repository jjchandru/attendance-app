<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#212529">
  <title>Attendance</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ancizar+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Attendance</span>
    </div>
  </nav>

  <main class="container pb-3">
    <a href="index.html" class="d-inline-block mb-2">&larr; Back to Classes</a>

    <div id="notFound" class="alert alert-danger d-none" role="alert">
      Class not found. It may have been removed.
    </div>

    <div id="attendanceContent" class="d-none">
      <h2 id="classTitle" class="mb-2"></h2>

      <!-- Year Selection -->
      <div class="mb-2 mt-2">
        <h6 class="mb-2">Year</h6>
        <div id="yearButtons" class="d-flex gap-2 flex-wrap"></div>
      </div>

      <!-- Month Selection -->
      <div class="mb-2">
        <h6 class="mb-2">Month</h6>
        <div id="monthButtons" class="d-flex gap-2 flex-wrap"></div>
      </div>

      <!-- Calendar -->
      <div id="calendarSection" class="d-none">
        <h6 class="mb-2">Day</h6>
        
        <div class="calendar-grid mb-2">
          <!-- Day headers -->
          <div class="calendar-header">
            <div class="calendar-day-header">M</div>
            <div class="calendar-day-header">T</div>
            <div class="calendar-day-header">W</div>
            <div class="calendar-day-header">T</div>
            <div class="calendar-day-header">F</div>
            <div class="calendar-day-header">S</div>
            <div class="calendar-day-header">S</div>
          </div>
          
          <!-- Date buttons will be inserted here -->
          <div id="calendarDates"></div>
        </div>
      </div>

      <!-- Period Details (appears when date selected) -->
      <div id="periodDetailsSection" class="d-none">
        <!-- <div class="alert alert-info mb-2"> -->
          <strong>Selected:</strong> <span id="selectedDateText"></span>
        <!-- </div> -->
        
        <!-- <h6 class="mb-2">Attendance Records for This Date</h6> -->
        <div id="periodDetailsList" class="mb-3"></div>
      </div>

      <!-- Take Attendance Button -->
      <div id="actionSection" class="d-none text-end">
        <button class="btn btn-success btn-lg" id="takeAttendanceBtn">
          Take Attendance
        </button>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/attendance.js"></script>
  <script>
    // Register service worker for offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(registration => {
            console.log('Service Worker registered successfully:', registration.scope);
          })
          .catch(error => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
