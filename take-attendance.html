<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#212529">
  <title>Take Attendance</title>
  <link rel="manifest" href="manifest.json">
  <link href="vendor/fonts/ancizar-sans.css" rel="stylesheet">
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Attendance</span>
      <span id="appStatusMount"></span>
    </div>
  </nav>

  <main class="container pb-5">
    <a href="#" id="backLink" class="d-inline-block mb-3">&larr; Back</a>

    <div id="notFound" class="alert alert-danger d-none" role="alert">
      Class not found. It may have been removed.
    </div>

    <div id="takeAttendanceContent" class="d-none">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
          <h2 id="classTitle" class="mb-1"></h2>
          <p class="text-muted mb-0" id="dateLabel"></p>
        </div>
        <button id="downloadCsvBtn" class="btn btn-success btn-sm">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-download" viewBox="0 0 16 16" style="margin-right: 4px;">
            <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
            <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
          </svg>
          Download CSV
        </button>
      </div>

      <div class="mb-3">
        <label class="form-label d-block">Periods</label>
        <div id="periodButtons" class="d-flex flex-wrap gap-2"></div>
      </div>

      <!-- Batch Selection (conditionally shown) -->
      <div id="batchSelectionSection" class="mb-3 d-none">
        <label class="form-label d-block">Batch</label>
        <div id="batchButtons" class="d-flex flex-wrap gap-2"></div>
      </div>

      <!-- Existing Records for This Date -->
      <div id="existingRecordsSection" class="mb-3 d-none">
        <h6 class="mb-2">Existing Attendance for This Date</h6>
        <div id="existingRecordsList"></div>
      </div>

      <p class="text-muted" id="absentCount"></p>

      <div class="list-group" id="studentList"></div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/take-attendance.js"></script>
  <script src="js/status.js"></script>
</body>
</html>
