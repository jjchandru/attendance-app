<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#212529">
  <title>Take Attendance</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ancizar+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Attendance</span>
    </div>
  </nav>

  <main class="container pb-5">
    <a href="#" id="backLink" class="d-inline-block mb-3">&larr; Back</a>

    <div id="notFound" class="alert alert-danger d-none" role="alert">
      Class not found. It may have been removed.
    </div>

    <div id="takeAttendanceContent" class="d-none">
      <h2 id="classTitle" class="mb-1"></h2>
      <p class="text-muted" id="dateLabel"></p>

      <div class="mb-3">
        <label class="form-label d-block">Periods</label>
        <div id="periodButtons" class="d-flex flex-wrap gap-2"></div>
      </div>

      <!-- Batch Selection (conditionally shown) -->
      <div id="batchSelectionSection" class="mb-3 d-none">
        <label class="form-label d-block">Batch</label>
        <div id="batchButtons" class="d-flex flex-wrap gap-2"></div>
      </div>

      <!-- Existing Records for This Date -->
      <div id="existingRecordsSection" class="mb-3 d-none">
        <h6 class="mb-2">Existing Attendance for This Date</h6>
        <div id="existingRecordsList"></div>
      </div>

      <p class="text-muted" id="absentCount"></p>

      <div class="list-group" id="studentList"></div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/take-attendance.js"></script>
  <script>
    // Register service worker for offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(registration => {
            console.log('Service Worker registered successfully:', registration.scope);
          })
          .catch(error => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
