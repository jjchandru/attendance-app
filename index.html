<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#212529">
  <meta name="description" content="Offline-capable attendance tracking for Crescent classes">
  <title>Attendance</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ancizar+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Attendance</span>
      <div>
        <span id="offlineReady" class="badge bg-success d-none me-2">✓ Offline Ready</span>
        <button id="clearCacheBtn" class="btn btn-sm btn-outline-light" title="Clear cache and reload">
          🔄
        </button>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">My Classes</h2>
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadClassModal">
        + Upload Class
      </button>
    </div>

    <div id="emptyState" class="alert alert-secondary d-none" role="alert">
      No classes added yet. Tap <strong>Upload Class</strong> and provide a class title plus the roster CSV
      (Name, Email columns) to add your first class.
    </div>

    <div id="classList" class="list-group"></div>
  </main>

  <!-- Upload Class Modal -->
  <div class="modal fade" id="uploadClassModal" tabindex="-1" aria-labelledby="uploadClassModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="uploadClassForm">
          <div class="modal-header">
            <h5 class="modal-title" id="uploadClassModalLabel">Upload Class</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div id="uploadError" class="alert alert-danger d-none" role="alert"></div>
            <div class="mb-3">
              <label for="classTitleInput" class="form-label">Class title</label>
              <input type="text" class="form-control" id="classTitleInput" placeholder="e.g. CSE - Sec A" required>
            </div>
            <div class="mb-3">
              <label for="classCsvInput" class="form-label">Roster CSV</label>
              <input type="file" class="form-control" id="classCsvInput" accept=".csv" required>
              <div class="form-text">CSV with Name and Email columns (header row required).</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Add Class</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Register service worker for offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(registration => {
            console.log('Service Worker registered successfully:', registration.scope);
            
            // Check for updates every time the page loads
            registration.update();
            
            // Listen for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              console.log('New service worker found, installing...');
              
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New service worker installed but old one still controlling
                  console.log('New version available! Reloading to activate...');
                  // Auto-reload to activate new service worker
                  window.location.reload();
                } else if (newWorker.state === 'activated') {
                  console.log('Service Worker activated - all resources cached!');
                  showOfflineReady();
                }
              });
            });
            
            // Check if service worker is already active and controlling the page
            if (navigator.serviceWorker.controller) {
              checkOfflineReady();
            }
          })
          .catch(error => {
            console.log('Service Worker registration failed:', error);
          });
          
        // Listen for when the service worker takes control
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('Service Worker now controlling the page');
          setTimeout(checkOfflineReady, 1000);
        });
        
        // Listen for cache update messages from service worker
        navigator.serviceWorker.addEventListener('message', event => {
          if (event.data.type === 'CACHE_UPDATED') {
            console.log('Cache updated to:', event.data.version);
            showOfflineReady();
          }
        });
      });
    }
    
    function checkOfflineReady() {
      // Check if all critical resources are cached
      if ('caches' in window) {
        caches.keys().then(cacheNames => {
          if (cacheNames.length > 0) {
            showOfflineReady();
          }
        });
      }
    }
    
    function showOfflineReady() {
      const badge = document.getElementById('offlineReady');
      if (badge) {
        badge.classList.remove('d-none');
        // Auto-hide after 5 seconds
        setTimeout(() => {
          badge.style.transition = 'opacity 0.5s';
          badge.style.opacity = '0';
        }, 5000);
      }
    }
    
    // Clear cache button handler
    document.addEventListener('DOMContentLoaded', () => {
      const clearCacheBtn = document.getElementById('clearCacheBtn');
      if (clearCacheBtn) {
        clearCacheBtn.addEventListener('click', async () => {
          if (confirm('Clear all cached files and reload? This will fetch the latest version.')) {
            try {
              // Unregister service worker
              if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let registration of registrations) {
                  await registration.unregister();
                }
              }
              
              // Clear all caches
              if ('caches' in window) {
                const cacheNames = await caches.keys();
                await Promise.all(cacheNames.map(name => caches.delete(name)));
              }
              
              // Reload the page
              window.location.reload(true);
            } catch (error) {
              console.error('Error clearing cache:', error);
              alert('Error clearing cache. Try clearing browser data manually.');
            }
          }
        });
      }
    });
  </script>
</body>
</html>
