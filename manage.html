<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Class</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ancizar+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Attendance</span>
    </div>
  </nav>

  <main class="container pb-5">
    <a href="index.html" class="d-inline-block mb-3">&larr; Back to Classes</a>

    <div id="notFound" class="alert alert-danger d-none" role="alert">
      Class not found. It may have been removed.
    </div>

    <div id="manageContent" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 id="classTitle" class="mb-0"></h2>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStudentModal">
          + Add Student
        </button>
      </div>
      <div class="mb-3">
        <span id="studentCount" class="text-muted"></span>
      </div>

      <div class="list-group" id="studentList"></div>
    </div>
  </main>

  <!-- Add Student Modal -->
  <div class="modal fade" id="addStudentModal" tabindex="-1" aria-labelledby="addStudentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="addStudentForm">
          <div class="modal-header">
            <h5 class="modal-title" id="addStudentModalLabel">Add Student</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div id="addStudentError" class="alert alert-danger d-none" role="alert"></div>
            <div class="mb-3">
              <label for="studentNameInput" class="form-label">Student name</label>
              <input type="text" class="form-control" id="studentNameInput" required>
            </div>
            <div class="mb-3">
              <label for="studentNumberInput" class="form-label">Student number</label>
              <input type="text" class="form-control" id="studentNumberInput" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Add Student</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Edit Student Modal -->
  <div class="modal fade" id="editStudentModal" tabindex="-1" aria-labelledby="editStudentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editStudentForm">
          <div class="modal-header">
            <h5 class="modal-title" id="editStudentModalLabel">Edit Student</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div id="editStudentError" class="alert alert-danger d-none" role="alert"></div>
            <div class="mb-3">
              <label for="editStudentNameInput" class="form-label">Student name</label>
              <input type="text" class="form-control" id="editStudentNameInput" required>
            </div>
            <div class="mb-3">
              <label for="editStudentNumberInput" class="form-label">Student number</label>
              <input type="text" class="form-control" id="editStudentNumberInput" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/manage.js"></script>
</body>
</html>
