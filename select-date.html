<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#212529">
  <title>Select Date - Attendance</title>
  <link rel="manifest" href="manifest.json">
  <link href="vendor/fonts/ancizar-sans.css" rel="stylesheet">
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-2">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Attendance</span>
      <span id="appStatusMount"></span>
    </div>
  </nav>

  <main class="container pb-3">
    <a href="#" id="backLink" class="d-inline-block mb-2">&larr; Back</a>

    <div id="notFound" class="alert alert-danger d-none" role="alert">
      Class not found. It may have been removed.
    </div>

    <div id="selectDateContent" class="d-none">
      <h2 id="classTitle" class="mb-2"></h2>

      <!-- Selection Summary -->
      <!-- <div class="alert alert-info" id="selectionSummary"> -->
        <strong>Select a date:</strong> <span id="summaryText">Choose year, month, and day below</span>
      <!-- </div> -->

      <!-- Year Selection -->
      <div class="mb-2 mt-2">
        <h6 class="mb-2">Year</h6>
        <div id="yearButtons" class="d-flex gap-2 flex-wrap"></div>
      </div>

      <!-- Month Selection -->
      <div class="mb-2">
        <h6 class="mb-2">Month</h6>
        <div id="monthButtons" class="d-flex gap-2 flex-wrap"></div>
      </div>

      <!-- Calendar -->
      <div id="calendarSection" class="d-none">
        <h6 class="mb-2">Day</h6>
        
        <div class="calendar-grid mb-2">
          <!-- Day headers -->
          <div class="calendar-header">
            <div class="calendar-day-header">M</div>
            <div class="calendar-day-header">T</div>
            <div class="calendar-day-header">W</div>
            <div class="calendar-day-header">T</div>
            <div class="calendar-day-header">F</div>
            <div class="calendar-day-header">S</div>
            <div class="calendar-day-header">S</div>
          </div>
          
          <!-- Date buttons will be inserted here -->
          <div id="calendarDates"></div>
        </div>
      </div>

      <!-- Take Attendance Button -->
      <div id="actionSection" class="d-none text-end">
        <button class="btn btn-success btn-lg" id="takeAttendanceBtn">
          Take Attendance
        </button>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/select-date.js"></script>
  <script src="js/status.js"></script>
</body>
</html>
